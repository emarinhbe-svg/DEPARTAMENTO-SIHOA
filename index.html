<div
    id="modal-inspection"
    role="dialog"
    aria-modal="true"
    aria-labelledby="inspection-title"
    class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50
           flex items-center justify-center hidden p-4"
>
    <div
        class="bg-white rounded-2xl max-w-lg w-full shadow-2xl p-6"
        style="max-height: 90vh; overflow-y: auto;"
    >
        <div class="flex justify-between items-center mb-4">
            <h3
                id="inspection-title"
                class="font-bold text-base text-slate-800"
            >
                Nueva Inspección
            </h3>

            <button
                type="button"
                onclick="closeModal('modal-inspection')"
                aria-label="Cerrar"
                class="text-xl text-slate-500"
            >
                &times;
            </button>
        </div>

        <form
            id="inspection-form"
            onsubmit="handleSaveInspection(event)"
            class="space-y-3 text-xs"
        >
            <div>
                <label for="insp-date" class="font-semibold">
                    Fecha
                </label>
                <input
                    id="insp-date"
                    type="date"
                    required
                    class="w-full p-2 bg-slate-50 border rounded-xl"
                >
            </div>

            <div>
                <label for="insp-norm" class="font-semibold">
                    Norma / Entidad
                </label>
                <input
                    id="insp-norm"
                    type="text"
                    required
                    placeholder="RACDA / MINEC / INPSASEL"
                    class="w-full p-2 bg-slate-50 border rounded-xl"
                >
            </div>

            <div>
                <label for="insp-area" class="font-semibold">
                    Área / Pozo
                </label>
                <input
                    id="insp-area"
                    type="text"
                    required
                    placeholder="Almacén / Taller / Pozo"
                    class="w-full p-2 bg-slate-50 border rounded-xl"
                >
            </div>

            <div>
                <label for="insp-auditor" class="font-semibold">
                    Inspector
                </label>
                <input
                    id="insp-auditor"
                    type="text"
                    required
                    placeholder="Nombre del inspector"
                    class="w-full p-2 bg-slate-50 border rounded-xl"
                >
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label for="insp-findings" class="font-semibold">
                        Cantidad de hallazgos
                    </label>
                    <input
                        id="insp-findings"
                        type="number"
                        min="0"
                        step="1"
                        value="0"
                        required
                        class="w-full p-2 bg-slate-50 border rounded-xl"
                    >
                </div>

                <div>
                    <label for="insp-status" class="font-semibold">
                        Estatus
                    </label>
                    <select
                        id="insp-status"
                        required
                        class="w-full p-2 bg-slate-50 border rounded-xl"
                    >
                        <option>Conforme</option>
                        <option>Con observaciones</option>
                        <option>No conforme</option>
                        <option>Pendiente</option>
                    </select>
                </div>
            </div>

            <p
                id="inspection-error"
                role="alert"
                class="hidden text-rose-700 bg-rose-50 p-3 rounded-xl"
            ></p>

            <div class="flex justify-end gap-2 pt-3">
                <button
                    type="button"
                    onclick="closeModal('modal-inspection')"
                    class="px-3 py-2 text-slate-500"
                >
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700
                           text-white rounded-xl font-semibold"
                >
                    Guardar inspección
                </button>
            </div>
        </form>
    </div>
</div>

<!-- =====================================================
     FUNCIONES DE INSPECCIONES
====================================================== -->
<script>
(function () {
    "use strict";

    let editingInspectionId = null;

    const originalOpenModal = window.openModal;
    const originalRenderAllTables = window.renderAllTables;

    const field = id => document.getElementById(id);

    function showError(message) {
        const element = field("inspection-error");

        element.textContent = message;
        element.classList.toggle("hidden", !message);
    }

    function today() {
        const date = new Date();
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");

        return `${year}-${month}-${day}`;
    }

    function persistInspections(records) {
        try {
            localStorage.setItem(
                "hds_insp",
                JSON.stringify(records)
            );

            return true;
        } catch (error) {
            console.error("No se pudieron guardar las inspecciones:", error);
            return false;
        }
    }

    // Mantiene el funcionamiento de los demás formularios.
    window.openModal = function (id) {
        if (id === "modal-inspection") {
            editingInspectionId = null;

            field("inspection-form").reset();
            field("inspection-title").textContent = "Nueva Inspección";
            field("insp-date").value = today();
            field("insp-findings").value = "0";

            showError("");
        }

        originalOpenModal(id);
    };

    function editInspection(index) {
        const inspection = inspData[index];

        if (!inspection) return;

        window.openModal("modal-inspection");

        editingInspectionId = inspection.id;

        field("inspection-title").textContent = "Editar inspección";

        for (const key of [
            "date",
            "norm",
            "area",
            "auditor",
            "findings"
        ]) {
            field(`insp-${key}`).value = inspection[key] ?? "";
        }

        const statusSelect = field("insp-status");
        const status = inspection.status || "Pendiente";

        const exists = Array.from(statusSelect.options).some(
            option => option.value === status
        );

        if (!exists) {
            statusSelect.add(new Option(status, status));
        }

        statusSelect.value = status;
    }

    function deleteInspection(index) {
        if (!inspData[index]) return;

        if (!confirm("¿Eliminar esta inspección?")) return;

        const nextRecords = inspData.filter(
            (_, currentIndex) => currentIndex !== index
        );

        if (!persistInspections(nextRecords)) {
            alert(
                "No se pudo guardar la eliminación. " +
                "La inspección no fue eliminada."
            );
            return;
        }

        inspData = nextRecords;
        renderInspections();
    }

    function renderInspections() {
        const tbody = field("inspections-tbody");

        if (!tbody) return;

        tbody.replaceChildren();

        if (inspData.length === 0) {
            const row = tbody.insertRow();
            const cell = row.insertCell();

            cell.colSpan = 7;
            cell.className = "p-6 text-center text-slate-500";
            cell.textContent = "No hay inspecciones registradas.";

            return;
        }

        inspData.forEach((inspection, index) => {
            const row = tbody.insertRow();
            row.className = "hover:bg-slate-50";

            const columns = [
                "date",
                "norm",
                "area",
                "auditor",
                "findings",
                "status"
            ];

            columns.forEach(key => {
                const cell = row.insertCell();

                cell.className = key === "findings"
                    ? "p-3 text-center font-bold"
                    : "p-3";

                cell.textContent = String(inspection[key] ?? "");
            });

            const actionsCell = row.insertCell();
            actionsCell.className = "p-3 text-center";

            const actions = document.createElement("div");
            actions.className =
                "flex items-center justify-center gap-3";

            const editButton = document.createElement("button");
            editButton.type = "button";
            editButton.textContent = "Seleccionar / Editar";
            editButton.className =
                "text-emerald-700 hover:text-emerald-900 font-semibold";

            editButton.addEventListener(
                "click",
                () => editInspection(index)
            );

            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.textContent = "Eliminar";
            deleteButton.className =
                "text-rose-600 hover:text-rose-800";

            deleteButton.addEventListener(
                "click",
                () => deleteInspection(index)
            );

            actions.append(editButton, deleteButton);
            actionsCell.appendChild(actions);
        });
    }

    window.handleSaveInspection = function (event) {
        event.preventDefault();
        showError("");

        if (!field("inspection-form").reportValidity()) return;

        const value = key => field(`insp-${key}`).value.trim();

        const record = {
            id: editingInspectionId ?? Date.now(),
            date: value("date"),
            norm: value("norm"),
            area: value("area"),
            auditor: value("auditor"),
            findings: Number(value("findings")),
            status: value("status")
        };

        if (!record.norm || !record.area || !record.auditor) {
            showError(
                "Complete norma o entidad, área o pozo e inspector. " +
                "No deje campos con solo espacios."
            );
            return;
        }

        if (
            !Number.isInteger(record.findings) ||
            record.findings < 0
        ) {
            showError(
                "Los hallazgos deben ser un número entero " +
                "igual o mayor que cero."
            );
            return;
        }

        const nextRecords = inspData.slice();
        const isEditing = editingInspectionId !== null;

        if (isEditing) {
            const index = nextRecords.findIndex(
                item => item.id === editingInspectionId
            );

            if (index === -1) {
                showError(
                    "Esta inspección ya no existe. " +
                    "Cierre el formulario y seleccione otro registro."
                );
                return;
            }

            nextRecords[index] = record;
        } else {
            while (
                nextRecords.some(item => item.id === record.id)
            ) {
                record.id += 1;
            }

            nextRecords.push(record);
        }

        if (!persistInspections(nextRecords)) {
            showError(
                "No se pudo guardar en este navegador. " +
                "El formulario permanece abierto para conservar " +
                "lo que escribió."
            );
            return;
        }

        inspData = nextRecords;

        renderInspections();
        window.closeModal("modal-inspection");
        window.switchTab("inspecciones");

        alert(
            isEditing
                ? "Inspección actualizada correctamente."
                : "Inspección registrada correctamente."
        );
    };

    // Actualiza las acciones después de renderizar otros módulos.
    window.renderAllTables = function () {
        try {
            originalRenderAllTables();
        } finally {
            renderInspections();
        }
    };

    if (document.readyState === "loading") {
        document.addEventListener(
            "DOMContentLoaded",
            renderInspections
        );
    } else {
        renderInspections();
    }
})();
</script>
